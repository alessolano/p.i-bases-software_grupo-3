name: CI
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Dependencies (API)
        working-directory: apps/api
        run: npm ci --ignore-scripts

      - name: Install Dependencies (Web)
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: Build Backend (API)
        working-directory: apps/api
        run: npm run build

      - name: Build Frontend (Web)
        working-directory: apps/web
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Linter Backend (API)
        working-directory: apps/api
        run: |
          npm ci
          npm run lint

      - name: Linter Frontend (Web)
        working-directory: apps/web
        run: |
          npm ci
          npm run lint

  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting.
          fetch-depth: 0

      # Triggering SonarQube analysis as results of it are required by Quality Gate check.
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  deploy:
    name: Deploy
    needs: [build, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Build and serve
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          script: |
            set -euo pipefail
            cd /opt/app/p.i-bases-software_grupo-3
            git fetch origin main

            cd apps/api
            npm ci
            npm run build

            cd ../web
            npm ci
            npm run build

            sudo systemctl restart cinetadel-api.service
            sudo systemctl --no-pager --full status cinetadel-api.service


